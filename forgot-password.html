
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoteRight - Forgot Password</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

    <div class="auth-container">

        <div class="auth-card forgot-card">

            <!-- LOGO -->
            <div class="logo">
                <div class="logo-icon">✓</div>
                <h1>VoteRight</h1>
            </div>

            <p class="subtitle">Password Recovery</p>

            <p class="forgot-description">
                Verify your registered email and security answer
                to create a new password.
            </p>

            <!-- STEP 1: EMAIL -->
            <div id="emailStep" class="reset-step active">

                <h2 class="step-heading">Find Your Account</h2>

                <form id="emailForm">

                    <div class="form-group">

                        <label for="email">Registered Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your registered email"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn-primary"
                        id="findAccountBtn"
                    >
                        Continue
                    </button>

                </form>

            </div>

            <!-- STEP 2: SECURITY QUESTION -->
            <div id="securityStep" class="reset-step">

                <h2 class="step-heading">Security Verification</h2>

                <div class="security-question-box">
                    <strong>Your Security Question:</strong>
                    <p id="securityQuestion">Loading question...</p>
                </div>

                <form id="securityForm">

                    <div class="form-group">

                        <label for="securityAnswer">
                            Your Security Answer
                        </label>

                        <input
                            type="text"
                            id="securityAnswer"
                            placeholder="Enter your answer"
                            required
                            autocomplete="off"
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn-primary"
                        id="verifyBtn"
                    >
                        Verify Answer
                    </button>

                </form>

            </div>

            <!-- STEP 3: NEW PASSWORD -->
            <div id="passwordStep" class="reset-step">

                <h2 class="step-heading">Create New Password</h2>

                <form id="passwordForm">

                    <div class="form-group">

                        <label for="newPassword">New Password</label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="8"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter new password"
                            minlength="8"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn-primary"
                        id="resetBtn"
                    >
                        Reset Password
                    </button>

                </form>

            </div>

            <!-- MESSAGE -->
            <div
                id="forgotMessage"
                class="forgot-message"
                role="status"
                aria-live="polite"
            ></div>

            <!-- FOOTER -->
            <a href="index.html" class="back-login">
                ← Back to Login
            </a>

            <div class="login-footer">
                <span></span>
                <p>VOTERIGHT · SECURE & TRANSPARENT</p>
                <span></span>
            </div>

        </div>

    </div>

    <script>

        const API_BASE = "/api/auth";

        let registeredEmail = "";
        let verifiedAnswer = "";

        // ELEMENTS
        const emailStep =
            document.getElementById("emailStep");

        const securityStep =
            document.getElementById("securityStep");

        const passwordStep =
            document.getElementById("passwordStep");

        const forgotMessage =
            document.getElementById("forgotMessage");


        // SHOW MESSAGE
        function showMessage(text, type = "") {

            forgotMessage.textContent = text;
            forgotMessage.className = "forgot-message " + type;

        }


        // SHOW STEP
        function showStep(step) {

            emailStep.classList.remove("active");
            securityStep.classList.remove("active");
            passwordStep.classList.remove("active");

            step.classList.add("active");

            showMessage("");

        }


        // ==========================================
        // STEP 1: FIND ACCOUNT
        // ==========================================

        document.getElementById("emailForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const button =
                    document.getElementById("findAccountBtn");

                registeredEmail = email;

                button.disabled = true;

                showMessage(
                    "Checking your account...",
                    "loading"
                );

                try {

                    const response = await fetch(
                        `${API_BASE}/forgot-password/question`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: registeredEmail
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {

                        throw new Error(
                            data.message || "Unable to find your account."
                        );

                    }

                    // IMPORTANT: BACKEND RETURNS security_question
                    const question =
                        data.security_question || data.question;

                    if (!question) {

                        throw new Error(
                            "Security question missing from server response."
                        );

                    }

                    document.getElementById(
                        "securityQuestion"
                    ).textContent = question;

                    showStep(securityStep);

                } catch (error) {

                    console.error("Forgot password question error:", error);

                    showMessage(
                        error.message || "Something went wrong.",
                        "error"
                    );

                } finally {

                    button.disabled = false;

                }

            });


        // ==========================================
        // STEP 2: COLLECT SECURITY ANSWER
        // ==========================================

        document.getElementById("securityForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                verifiedAnswer =
                    document.getElementById("securityAnswer")
                    .value.trim();

                if (!verifiedAnswer) {

                    showMessage(
                        "Please enter your security answer.",
                        "error"
                    );

                    return;

                }

                showStep(passwordStep);

            });


        // ==========================================
        // STEP 3: RESET PASSWORD
        // ==========================================

        document.getElementById("passwordForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const newPassword =
                    document.getElementById("newPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const button =
                    document.getElementById("resetBtn");


                if (newPassword.length < 8) {

                    showMessage(
                        "Password must contain at least 8 characters.",
                        "error"
                    );

                    return;

                }


                if (newPassword !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;

                }


                button.disabled = true;

                showMessage(
                    "Verifying answer and resetting password...",
                    "loading"
                );


                try {

                    const response = await fetch(
                        `${API_BASE}/forgot-password/reset`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: registeredEmail,

                                security_answer: verifiedAnswer,

                                new_password: newPassword,

                                confirm_password: confirmPassword

                            })
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message || "Password reset failed."
                        );

                    }


                    showMessage(
                        "Password reset successful! Redirecting to login...",
                        "success"
                    );

                    document.getElementById("passwordForm").reset();


                    setTimeout(function() {

                        window.location.href = "index.html";

                    }, 1800);


                } catch (error) {

                    console.error("Password reset error:", error);

                    showMessage(
                        error.message || "Something went wrong.",
                        "error"
                    );

                } finally {

                    button.disabled = false;

                }

            });

    </script>

</body>
</html>
