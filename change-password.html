
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteRight - Change Password</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .password-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: #090909;
            color: #f5f1e8;
        }

        .password-card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            border: 1px solid #b99a55;
            border-radius: 16px;
            background: #151515;
            box-shadow: 0 18px 50px #0008;
        }

        .password-card h1 {
            color: #d8bd7a;
            margin-bottom: 10px;
        }

        .password-card p {
            color: #c9c1b1;
            line-height: 1.6;
        }

        .password-card label {
            display: block;
            margin: 18px 0 7px;
            color: #e8d9b4;
        }

        .password-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #76643d;
            border-radius: 8px;
            background: #0d0d0d;
            color: #fff;
        }

        .password-card button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #c5a45e;
            color: #17130b;
            font-weight: 700;
            cursor: pointer;
        }

        .password-card button:hover {
            background: #dfc27e;
        }

        .password-message {
            margin-top: 16px;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d8bd7a;
            text-decoration: none;
        }
    </style>
</head>

<body class="password-page">

    <main class="password-card">

        <h1>Change Password</h1>

        <p>
            Enter your current password and choose a new secure password.
        </p>

        <form id="changePasswordForm">

            <label for="current_password">
                Current Password
            </label>

            <input
                type="password"
                id="current_password"
                autocomplete="current-password"
                required
            >

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                id="new_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <div
            id="passwordMessage"
            class="password-message"
            role="status"
        ></div>

        <a class="back-link" href="dashboard.html">
            ← Back to Dashboard
        </a>

    </main>

    <script>
        const form = document.getElementById("changePasswordForm");
        const message = document.getElementById("passwordMessage");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const currentPassword =
                document.getElementById("current_password").value;

            const newPassword =
                document.getElementById("new_password").value;

            const confirmPassword =
                document.getElementById("confirm_password").value;

            if (newPassword !== confirmPassword) {
                message.textContent = "New passwords do not match.";
                return;
            }

            const token = localStorage.getItem("vr_token");

            if (!token) {
                message.textContent = "Please log in first.";
                return;
            }

            try {

                message.textContent = "Updating password...";

                const response = await fetch(
                    "http://127.0.0.1:5000/api/auth/change-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },

                        body: JSON.stringify({
                            current_password: currentPassword,
                            new_password: newPassword,
                            confirm_password: confirmPassword
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Password update failed."
                    );
                }

                message.textContent =
                    "Password changed successfully. Please log in again.";

                localStorage.removeItem("vr_token");
                localStorage.removeItem("vr_user");

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1800);

            } catch (error) {

                message.textContent = error.message;

            }

        });
    </script>

</body>
</html>
