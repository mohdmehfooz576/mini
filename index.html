<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoteRight - Login</title>

    <link rel="stylesheet" href="css/style.css">

    
       
</head>

<body class="login-page">

    <div class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->
            <div class="logo">
                <div class="logo-icon">✓</div>
                <h1>VoteRight</h1>
            </div>

            <p class="subtitle">
                Secure Online Voting System
            </p>

            <!-- LOGIN TYPE -->
            <div class="login-tabs">

                <button
                    type="button"
                    id="voterTab"
                    class="login-tab active"
                    onclick="selectLoginType('voter')"
                >
                    Voter Login
                </button>

                <button
                    type="button"
                    id="adminTab"
                    class="login-tab"
                    onclick="selectLoginType('admin')"
                >
                    Admin Login
                </button>

            </div>

            <h2 id="loginTitle">Voter Login</h2>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

            <!-- MESSAGE -->
            <div id="message" role="status" aria-live="polite"></div>

            <!-- VOTER AUTH LINKS -->
            <div
                id="registerSection"
                class="auth-links"
            >

                <a
                    href="forgot-password.html"
                    class="forgot-link"
                >
                    Forgot Password?
                </a>

                <a
                    href="register.html"
                    class="register-link"
                >
                    Register Here
                </a>

            </div>

            <!-- ADMIN INFO -->
            <div
                id="adminInfo"
                class="admin-info"
                style="display: none;"
            >

                <div class="admin-icon">♙</div>

                <p class="admin-title">
                    Admin Login
                </p>

                <p class="admin-description">
                    Use your administrator credentials
                    to access the admin panel.
                </p>

            </div>

            <!-- FOOTER -->
            <div class="login-footer">
                <span></span>
                <p>VOTERIGHT · SECURE & TRANSPARENT</p>
                <span></span>
            </div>

        </div>

    </div>

    <!-- JAVASCRIPT: ORIGINAL FUNCTIONALITY -->

    <script>

        let loginType = "voter";


        /*
         * ==========================================
         * SELECT LOGIN TYPE
         * ==========================================
         */

        function selectLoginType(type) {

            loginType = type;

            const voterTab =
                document.getElementById("voterTab");

            const adminTab =
                document.getElementById("adminTab");

            const loginTitle =
                document.getElementById("loginTitle");

            const registerSection =
                document.getElementById("registerSection");

            const adminInfo =
                document.getElementById("adminInfo");


            if (type === "admin") {

                voterTab.classList.remove("active");

                adminTab.classList.add("active");

                loginTitle.textContent = "Admin Login";

                registerSection.style.display = "none";

                adminInfo.style.display = "block";

            } else {

                adminTab.classList.remove("active");

                voterTab.classList.add("active");

                loginTitle.textContent = "Voter Login";

                registerSection.style.display = "flex";

                adminInfo.style.display = "none";

            }

        }


        /*
         * ==========================================
         * LOGIN
         * ==========================================
         */

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");

        const loginBtn =
            document.getElementById("loginBtn");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                message.textContent = "Logging in...";

                message.className = "message-loading";

                loginBtn.disabled = true;


                try {

                    const response = await fetch(
                        "/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message || "Login failed"
                        );

                    }


                    /*
                     * CHECK SELECTED LOGIN TYPE
                     */

                    if (
                        loginType === "admin" &&
                        data.user.role !== "admin"
                    ) {

                        throw new Error(
                            "This account is not an admin account."
                        );

                    }


                    if (
                        loginType === "voter" &&
                        data.user.role !== "voter"
                    ) {

                        throw new Error(
                            "Please use Admin Login for an admin account."
                        );

                    }


                    /*
                     * SAVE TOKEN
                     */

                    localStorage.setItem(
                        "vr_token",
                        data.token
                    );


                    /*
                     * SAVE USER
                     */

                    localStorage.setItem(
                        "vr_user",
                        JSON.stringify(data.user)
                    );


                    message.textContent =
                        "Login successful! Redirecting...";

                    message.className = "message-success";


                    /*
                     * ADMIN REDIRECT
                     */

                    if (data.user.role === "admin") {

                        setTimeout(function() {

                            window.location.href =
                                "admin/manage-elections.html";

                        }, 700);


                    /*
                     * VOTER REDIRECT
                     */

                    } else {

                        setTimeout(function() {

                            window.location.href =
                                "dashboard.html";

                        }, 700);

                    }


                } catch (error) {

                    console.error("Login error:", error);

                    message.textContent =
                        error.message || "Something went wrong.";

                    message.className = "message-error";

                    loginBtn.disabled = false;

                }

            }
        );

    </script>

</body>
</html>
