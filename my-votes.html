<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoteRight - My Votes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="topbar">

        <div class="brand">
            <div class="logo-icon">✓</div>
            <span>VoteRight</span>
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="elections.html">
                Elections
            </a>

            <a href="my-votes.html" class="active">
                My Votes
            </a>

            <a href="results.html">
                Results
            </a>

            <button
                type="button"
                onclick="logout()"
                class="logout-btn"
            >
                Logout
            </button>

        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="dashboard-container">

        <section class="welcome-section">

            <div>

                <p class="small-text">
                    VoteRight Online Voting
                </p>

                <h1>
                    My Votes
                </h1>

                <p>
                    View the elections in which you have voted.
                </p>

            </div>

        </section>


        <!-- =========================
             MESSAGE
        ========================== -->

        <div
            id="message"
            class="message"
        >
            Loading your votes...
        </div>


        <!-- =========================
             VOTES
        ========================== -->

        <section class="dashboard-card">

            <div class="section-heading">

                <h2>
                    Voting History
                </h2>

                <button
                    type="button"
                    onclick="loadMyVotes()"
                >
                    Refresh
                </button>

            </div>


            <div
                id="votesContainer"
                class="quick-actions"
            ></div>

        </section>

    </main>


    <script>

        /* =========================================
           AUTHENTICATION
        ========================================= */

        const token =
            localStorage.getItem(
                "vr_token"
            );

        const savedUser =
            localStorage.getItem(
                "vr_user"
            );


        if (!token || !savedUser) {

            window.location.href =
                "index.html";

        }


        let currentUser = null;


        try {

            currentUser =
                JSON.parse(
                    savedUser
                );


            if (
                currentUser.role !== "voter"
            ) {

                window.location.href =
                    "index.html";

            }

        } catch (error) {

            localStorage.removeItem(
                "vr_token"
            );

            localStorage.removeItem(
                "vr_user"
            );

            window.location.href =
                "index.html";

        }


        /* =========================================
           LOGOUT
        ========================================= */

        function logout() {

            localStorage.removeItem(
                "vr_token"
            );

            localStorage.removeItem(
                "vr_user"
            );

            window.location.href =
                "index.html";

        }


        /* =========================================
           LOAD MY VOTES
        ========================================= */

        async function loadMyVotes() {

            const container =
                document.getElementById(
                    "votesContainer"
                );

            const message =
                document.getElementById(
                    "message"
                );


            container.innerHTML =
                "Loading your votes...";

            message.textContent =
                "";


            try {

                const response =
                    await fetch(
                        "/api/votes/my-votes",
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not load your votes."
                    );

                }


                const votes =
                    data.votes || [];


                container.innerHTML =
                    "";


                /* =================================
                   NO VOTES
                ================================= */

                if (
                    votes.length === 0
                ) {

                    message.textContent =
                        "You have not voted in any election yet.";

                    message.style.color =
                        "#555";


                    container.innerHTML = `

                        <div class="action-card">

                            <div class="action-icon">
                                🗳️
                            </div>

                            <h3>
                                No Votes Yet
                            </h3>

                            <p>
                                Your voting history will
                                appear here after you cast
                                your first vote.
                            </p>

                            <button
                                type="button"
                                onclick="window.location.href='elections.html'"
                            >
                                View Elections
                            </button>

                        </div>

                    `;

                    return;

                }


                /* =================================
                   VOTES FOUND
                ================================= */

                message.textContent =
                    `You have voted in ${votes.length} election(s).`;

                message.style.color =
                    "green";


                votes.forEach(
                    function(vote) {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "action-card";


                        const votedDate =
                            formatDate(
                                vote.voted_at
                            );


                        card.innerHTML = `

                            <div class="action-icon">
                                ✓
                            </div>

                            <h3>
                                ${escapeHTML(
                                    vote.election_name ||
                                    "Election"
                                )}
                            </h3>

                            <p>
                                <strong>
                                    Your Vote:
                                </strong>
                            </p>

                            <p>
                                ${escapeHTML(
                                    vote.candidate_name ||
                                    "Candidate"
                                )}
                            </p>

                            <p>
                                <strong>
                                    Voted On:
                                </strong>

                                ${votedDate}
                            </p>

                            <span
                                style="
                                    display:inline-block;
                                    margin-top:10px;
                                    padding:6px 12px;
                                    border-radius:20px;
                                    background:#e8f7ee;
                                    color:#198754;
                                    font-size:13px;
                                "
                            >
                                Vote Recorded
                            </span>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "My votes error:",
                    error
                );


                container.innerHTML =
                    "";


                message.textContent =
                    error.message ||
                    "Unable to load your voting history.";

                message.style.color =
                    "red";

            }

        }


        /* =========================================
           DATE FORMAT
        ========================================= */

        function formatDate(
            dateValue
        ) {

            if (!dateValue) {

                return "-";

            }


            const date =
                new Date(
                    dateValue
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return String(
                    dateValue
                );

            }


            return date.toLocaleString(
                "en-IN",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        /* =========================================
           HTML ESCAPING
        ========================================= */

        function escapeHTML(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value;


            return div.innerHTML;

        }


        /* =========================================
           START
        ========================================= */

        loadMyVotes();

    </script>

</body>

</html>
