
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteRight - Election Results</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="topbar">

        <div class="brand">
            <div class="logo-icon">✓</div>
            <span id="brandName">VoteRight</span>
        </div>

        <nav id="mainNav">
            <!-- Links are added according to user role -->
        </nav>

    </header>

    <!-- MAIN -->
    <main class="dashboard-container">

        <section class="welcome-section">
            <div>
                <p class="small-text">VoteRight Online Voting</p>
                <h1>Election Results</h1>
                <p>View the current vote count for each election.</p>
            </div>
        </section>

        <!-- ELECTION SELECTOR -->
        <section class="dashboard-card">

            <div class="section-heading">
                <h2>Select Election</h2>
            </div>

            <div class="form-group">
                <label for="electionSelect">Election</label>

                <select id="electionSelect">
                    <option value="">Loading elections...</option>
                </select>
            </div>

            <div id="message" class="message"></div>

        </section>

        <!-- RESULTS -->
        <section
            id="resultsSection"
            class="dashboard-card"
            style="display:none;"
        >

            <div class="section-heading">
                <h2 id="resultTitle">Results</h2>

                <button
                    type="button"
                    id="refreshResults"
                >
                    Refresh
                </button>
            </div>

            <div
                id="resultsContainer"
                class="quick-actions"
            ></div>

        </section>

    </main>

    <script>
    /* =========================================
       AUTHENTICATION
    ========================================= */

    const token = localStorage.getItem("vr_token");
    const savedUser = localStorage.getItem("vr_user");

    let currentUser = null;

    if (!token || !savedUser) {
        window.location.replace("index.html");
    } else {
        try {
            currentUser = JSON.parse(savedUser);

            if (
                !currentUser ||
                !["admin", "voter"].includes(currentUser.role)
            ) {
                window.location.replace("index.html");
            }
        } catch (error) {
            localStorage.removeItem("vr_token");
            localStorage.removeItem("vr_user");
            window.location.replace("index.html");
        }
    }

    /* =========================================
       NAVBAR BASED ON ROLE
    ========================================= */

    const mainNav = document.getElementById("mainNav");
    const brandName = document.getElementById("brandName");

    if (currentUser && currentUser.role === "admin") {

        brandName.textContent = "VoteRight Admin";

        mainNav.innerHTML = `
            <a href="admin/manage-voters.html">
                Manage Voters
            </a>

            <a href="admin/manage-elections.html">
                Elections
            </a>

            <a href="admin/candidates.html">
                Candidates
            </a>

            <a href="results.html" class="active">
                Results
            </a>

            <button
                type="button"
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>
        `;

    } else {

        mainNav.innerHTML = `
            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="elections.html">
                Elections
            </a>

            <a href="my-votes.html">
                My Votes
            </a>

            <a href="results.html" class="active">
                Results
            </a>

            <button
                type="button"
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>
        `;
    }

    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {
        localStorage.removeItem("vr_token");
        localStorage.removeItem("vr_user");
        window.location.href = "index.html";
    }

    /* =========================================
       ELEMENTS
    ========================================= */

    const electionSelect =
        document.getElementById("electionSelect");

    const resultsSection =
        document.getElementById("resultsSection");

    const resultsContainer =
        document.getElementById("resultsContainer");

    const message =
        document.getElementById("message");

    const resultTitle =
        document.getElementById("resultTitle");

    /* =========================================
       API HELPERS
    ========================================= */

    async function apiGet(url) {

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        let data = {};

        try {
            data = await response.json();
        } catch (error) {
            data = {};
        }

        if (response.status === 401) {
            localStorage.removeItem("vr_token");
            localStorage.removeItem("vr_user");
            window.location.replace("index.html");
            throw new Error("Session expired. Please login again.");
        }

        if (!response.ok) {
            throw new Error(
                data.message || "Unable to load data."
            );
        }

        return data;
    }

    /* =========================================
       LOAD ELECTIONS
    ========================================= */

    async function loadElections() {

        message.textContent = "Loading elections...";
        message.style.color = "#555";

        electionSelect.innerHTML = `
            <option value="">Loading elections...</option>
        `;

        try {

            const data = await apiGet("/api/elections/");
            const elections = data.elections || [];

            electionSelect.innerHTML = `
                <option value="">Select an election</option>
            `;

            elections.forEach(function(election) {

                const option = document.createElement("option");

                option.value = election.id;
                option.textContent = election.name;

                electionSelect.appendChild(option);
            });

            if (elections.length === 0) {
                showMessage("No elections found.", "red");
                return;
            }

            clearMessage();

            const params =
                new URLSearchParams(window.location.search);

            const requestedId = params.get("id");

            if (requestedId) {

                const matchingElection = elections.find(
                    election =>
                        String(election.id) === String(requestedId)
                );

                if (matchingElection) {
                    electionSelect.value = String(matchingElection.id);
                    await loadResults();
                } else {
                    showMessage(
                        "The requested election was not found.",
                        "red"
                    );
                }
            }

        } catch (error) {

            console.error("Election loading error:", error);
            showMessage(error.message, "red");

            electionSelect.innerHTML = `
                <option value="">Could not load elections</option>
            `;
        }
    }

    /* =========================================
       ELECTION SELECTION
    ========================================= */

    electionSelect.addEventListener("change", async function() {

        const electionId = electionSelect.value;

        if (!electionId) {
            resultsSection.style.display = "none";
            resultsContainer.innerHTML = "";
            clearMessage();

            window.history.replaceState(
                null,
                "",
                "results.html"
            );

            return;
        }

        window.history.replaceState(
            null,
            "",
            "results.html?id=" + encodeURIComponent(electionId)
        );

        await loadResults();
    });

    /* =========================================
       LOAD RESULTS
    ========================================= */

    async function loadResults() {

        const electionId = electionSelect.value;

        if (!electionId) {
            showMessage("Please select an election.", "red");
            return;
        }

        resultsSection.style.display = "block";
        resultsContainer.innerHTML = "Loading results...";
        resultTitle.textContent = "Election Results";
        clearMessage();

        try {

            const data = await apiGet(
                `/api/elections/${encodeURIComponent(electionId)}/results`
            );

            const results = data.results || [];

            resultsContainer.innerHTML = "";

            if (results.length === 0) {

                resultsContainer.innerHTML = `
                    <div class="action-card">
                        <div class="action-icon">📊</div>
                        <h3>No Results Available</h3>
                        <p>
                            No candidates have been added
                            or no results are available yet.
                        </p>
                    </div>
                `;

                showMessage("No votes recorded yet.", "#555");
                return;
            }

            results.sort(function(a, b) {
                return Number(b.vote_count || 0) -
                       Number(a.vote_count || 0);
            });

            const totalVotes = results.reduce(
                function(total, candidate) {
                    return total + Number(candidate.vote_count || 0);
                },
                0
            );

            results.forEach(function(candidate, index) {

                const votes = Number(candidate.vote_count || 0);

                const percentage = totalVotes > 0
                    ? (votes / totalVotes) * 100
                    : 0;

                const card = document.createElement("div");
                card.className = "action-card";

                card.innerHTML = `
                    <div class="action-icon">
                        ${index === 0 ? "🏆" : "👤"}
                    </div>

                    <h3>${escapeHTML(candidate.name)}</h3>

                    <p>
                        ${escapeHTML(
                            candidate.year_position || "Candidate"
                        )}
                    </p>

                    <p>
                        <strong>Votes:</strong> ${votes}
                    </p>

                    <p>
                        <strong>Percentage:</strong>
                        ${percentage.toFixed(1)}%
                    </p>

                    <div style="
                        width:100%;
                        height:10px;
                        background:#e9ecef;
                        border-radius:10px;
                        overflow:hidden;
                        margin-top:12px;
                    ">
                        <div style="
                            width:${percentage}%;
                            height:100%;
                            background:#5b4bea;
                            border-radius:10px;
                        "></div>
                    </div>
                `;

                resultsContainer.appendChild(card);
            });

            showMessage(
                `Total votes recorded: ${totalVotes}`,
                "green"
            );

        } catch (error) {

            console.error("Results loading error:", error);

            resultsContainer.innerHTML = "";

            showMessage(
                error.message || "Unable to load results.",
                "red"
            );
        }
    }

    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(text, color) {
        message.textContent = text;
        message.style.color = color;
    }

    function clearMessage() {
        message.textContent = "";
    }

    /* =========================================
       HTML SAFETY
    ========================================= */

    function escapeHTML(value) {

        const div = document.createElement("div");
        div.textContent = value ?? "";

        return div.innerHTML;
    }

    /* =========================================
       REFRESH
    ========================================= */

    document.getElementById("refreshResults")
        .addEventListener("click", loadResults);

    /* =========================================
       START
    ========================================= */

    if (token && currentUser) {
        loadElections();
    }

    </script>

</body>
</html>
