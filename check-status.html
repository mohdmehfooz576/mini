
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteRight | Check Application Status</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="status-page">

    <nav class="status-nav">
        <a class="status-brand" href="home.html">
            <span class="status-brand-icon">✓</span>
            VoteRight
        </a>

        <div class="status-nav-links">
            <a href="home.html">Home</a>
            <a href="home.html#how-it-works">How It Works</a>
            <a href="check-status.html" class="active">Check Status</a>
            <a href="home.html#notices">Notices</a>
            <a href="index.html" class="status-login-link">Login</a>
        </div>
    </nav>


    <main class="status-wrapper">

        <section class="status-card">

            <div class="status-brand-mark">✓</div>

            <div class="status-eyebrow">VOTERIGHT • VOTER VERIFICATION</div>

            <h1>Check Your Status</h1>

            <p class="status-description">
                Enter the roll number and email address used during
                registration to check your voter application status.
            </p>


            <form id="statusForm">

                <div class="status-field">

                    <label for="roll_no">Roll Number</label>

                    <input
                        type="text"
                        id="roll_no"
                        name="roll_no"
                        placeholder="Enter your roll number"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="status-field">

                    <label for="email">Registered Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    class="status-button"
                    id="checkButton"
                    type="submit"
                >
                    Check Application Status →
                </button>

            </form>


            <div
                id="statusMessage"
                role="status"
                aria-live="polite"
            ></div>

            <div class="status-security-note">
                <span>🔒</span>
                Your information is checked securely.
            </div>

        </section>


        <p class="status-footer">
            © VoteRight · Secure Online Voting System
        </p>

    </main>


    <!-- ORIGINAL JAVASCRIPT — KEPT INSIDE HTML -->
    <script>

        const API_BASE = "http://127.0.0.1:5000";

        const statusForm =
            document.getElementById("statusForm");

        const statusMessage =
            document.getElementById("statusMessage");

        const checkButton =
            document.getElementById("checkButton");


        /* HTML ESCAPING */

        function escapeHTML(value) {

            return String(value ?? "").replace(/[&<>"']/g, function (char) {

                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];

            });

        }


        /* CHECK APPLICATION STATUS */

        statusForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const roll_no =
                document.getElementById("roll_no").value.trim();

            const email =
                document.getElementById("email").value.trim();


            statusMessage.replaceChildren();

            checkButton.disabled = true;

            checkButton.textContent = "Checking...";


            try {

                const response = await fetch(
                    `${API_BASE}/api/voters/check-status`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            roll_no,
                            email
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok || data.success !== true) {

                    statusMessage.textContent =
                        data.message ||
                        "Status could not be found. Check your details.";

                    statusMessage.className = "status-error";

                    return;

                }


                const status = String(data.status || "");


                const statusClass = {
                    Pending: "pending",
                    Approved: "approved",
                    Rejected: "rejected"
                }[status] || "pending";


                let explanation = "";


                if (status === "Pending") {

                    explanation =
                        "Your application is awaiting administrator review.";

                } else if (status === "Approved") {

                    explanation =
                        "Your voter application has been approved.";

                } else if (status === "Rejected") {

                    explanation =
                        "Your voter application has been rejected.";

                }


                const reason = status === "Rejected"
                    ? (
                        data.rejection_reason ||
                        "No rejection reason was provided."
                    )
                    : "";


                statusMessage.className = "status-success";


                statusMessage.innerHTML = `

                    <div class="status-result-card">

                        <div class="status-result-icon">✓</div>

                        <h2>Application Result</h2>

                        <p class="status-result-label">
                            YOUR APPLICATION STATUS
                        </p>

                        <span class="status-badge ${statusClass}">
                            ${escapeHTML(status)}
                        </span>

                        <p class="status-explanation">
                            ${escapeHTML(explanation)}
                        </p>

                        ${
                            status === "Rejected"
                                ? `
                                    <div class="reason-box">
                                        <strong>Rejection Reason</strong>
                                        <p>${escapeHTML(reason)}</p>
                                    </div>
                                `
                                : ""
                        }

                    </div>

                `;


            } catch (error) {

                statusMessage.className = "status-error";

                statusMessage.textContent =
                    "Unable to connect to VoteRight server. Please ensure the backend is running and try again.";

            } finally {

                checkButton.disabled = false;

                checkButton.textContent =
                    "Check Application Status →";

            }

        });

    </script>

</body>
</html>
