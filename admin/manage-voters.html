
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteRight - Manage Voters</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <div class="logo-icon">✓</div>
        <span>VoteRight Admin</span>
    </div>
    <nav>
        <a href="manage-voters.html" class="active">Manage Voters</a>
        <a href="manage-elections.html">Elections</a>
        <a href="candidates.html">Candidates</a>
        <button type="button" onclick="logout()" class="logout-btn">Logout</button>
    </nav>
</header>

<main class="dashboard-container">
    <section class="welcome-section">
        <div>
            <p class="small-text">VoteRight Administration</p>
            <h1>Manage Voters</h1>
            <p>Approve, reject and manage voter registrations.</p>
        </div>
    </section>

    <div id="message" class="message">Loading voters...</div>

    <section class="dashboard-card">
        <div class="section-heading">
            <h2>Registered Voters</h2>
            <button type="button" class="btn-primary" onclick="loadVoters()">Refresh</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Roll No.</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="votersTableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
const token = localStorage.getItem("vr_token");
const savedUser = localStorage.getItem("vr_user");

try {
    const user = JSON.parse(savedUser || "null");
    if (!token || !user || user.role !== "admin") {
        window.location.href = "../index.html";
    }
} catch (error) {
    window.location.href = "../index.html";
}

function logout() {
    localStorage.removeItem("vr_token");
    localStorage.removeItem("vr_user");
    window.location.href = "../index.html";
}

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : String(value);
    return div.innerHTML;
}

async function loadVoters() {
    const message = document.getElementById("message");
    const tableBody = document.getElementById("votersTableBody");

    message.textContent = "Loading voters...";
    tableBody.replaceChildren();

    try {
        const response = await fetch("/api/voters/", {
            headers: { "Authorization": "Bearer " + token }
        });

        const data = await response.json();

        if (response.status === 401 || response.status === 403) {
            alert("Admin session expired or access denied. Please log in again.");
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(data.message || "Could not load voters.");
        }

        const voters = data.voters || [];

        if (!voters.length) {
            tableBody.innerHTML =
                '<tr><td colspan="7" style="text-align:center;">No registered voters found.</td></tr>';
            message.textContent = "No voters registered yet.";
            return;
        }

        message.textContent = `${voters.length} voter(s) found.`;

        voters.forEach(voter => {
            const row = document.createElement("tr");
            let actions = "";

            if (voter.status === "Pending") {
                actions = `
                    <button type="button" class="btn-primary"
                        onclick="changeStatus(${Number(voter.id)}, 'Approved')">Approve</button>
                    <button type="button"
                        onclick="changeStatus(${Number(voter.id)}, 'Rejected')">Reject</button>`;
            } else if (voter.status === "Approved") {
                actions = `
                    <button type="button"
                        onclick="changeStatus(${Number(voter.id)}, 'Rejected')">Reject</button>
                    <button type="button"
                        onclick="deleteVoter(${Number(voter.id)})">Delete</button>`;
            } else {
                actions = `
                    <button type="button" class="btn-primary"
                        onclick="changeStatus(${Number(voter.id)}, 'Approved')">Approve</button>
                    <button type="button"
                        onclick="deleteVoter(${Number(voter.id)})">Delete</button>`;
            }

            row.innerHTML = `
                <td>${escapeHTML(voter.name || "-")}</td>
                <td>${escapeHTML(voter.email || "-")}</td>
                <td>${escapeHTML(voter.roll_no || "-")}</td>
                <td>${escapeHTML(voter.department || "-")}</td>
                <td>${escapeHTML(voter.year || "-")}</td>
                <td><strong>${escapeHTML(voter.status || "-")}</strong></td>
                <td>${actions}</td>`;

            tableBody.appendChild(row);
        });
    } catch (error) {
        console.error("Load voters error:", error);
        message.textContent = error.message || "Unable to load voters.";
    }
}

async function changeStatus(voterId, status) {
    let rejectionReason = null;

    if (status === "Rejected") {
        rejectionReason = prompt(
            "Enter the reason for rejecting this registration:"
        );

        if (rejectionReason === null) return;

        rejectionReason = rejectionReason.trim();

        if (!rejectionReason) {
            alert("Please enter a rejection reason.");
            return;
        }
    }

    const confirmation = status === "Rejected"
        ? `Reject this voter?\n\nReason: ${rejectionReason}`
        : `Approve this voter?`;

    if (!confirm(confirmation)) return;

    try {
        const response = await fetch(
            `/api/admin/voters/${voterId}/status`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    status: status,
                    rejection_reason: rejectionReason
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Status update failed.");
        }

        alert(data.message || "Voter status updated.");
        await loadVoters();
    } catch (error) {
        console.error("Status update error:", error);
        alert(error.message || "Unable to update voter status.");
    }
}

async function deleteVoter(voterId) {
    if (!confirm("Are you sure you want to delete this voter?")) return;

    try {
        const response = await fetch(
            `/api/admin/voters/${voterId}`,
            {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Could not delete voter.");
        }

        alert(data.message || "Voter deleted.");
        await loadVoters();
    } catch (error) {
        console.error("Delete voter error:", error);
        alert(error.message || "Could not delete voter.");
    }
}

loadVoters();
</script>
</body>
</html>
